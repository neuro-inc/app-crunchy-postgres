{{- if .Values.dataSourceSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default .Release.Name .Values.name }}-src-pgbackrest-secret
type: Opaque
data:
{{- if .Values.dataSourceSecret.s3 }}
  {{- $args := dict "s3" .Values.dataSourceSecret.s3 "index" 0 }}
  s3.conf: |-
        {{ include "postgres.s3" $args | b64enc }}
{{- else if .Values.dataSourceSecret.gcs }}
  {{- $args := dict "gcs" .Values.dataSourceSecret.gcs "index" 0 }}
  gcs.conf: |-
        {{ include "postgres.gcs" $args | b64enc }}
  gcs-key.json: |-
        {{ .Values.dataSourceSecret.gcs.key | b64enc }}
{{- else if .Values.dataSourceSecret.azure }}
  {{- $args := dict "azure" .Values.dataSourceSecret.azure "index" 0 }}
  azure.conf: |-
        {{ include "postgres.azure" $args | b64enc }}
{{- end }}
{{- end }}
